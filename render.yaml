services:
  - type: web
    name: physiology-sba-7-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Uncomment to use persistent Postgres later:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: physiology-db
      #     property: connectionString

# Optional persistent DB (free plan). Uncomment if you want Postgres instead of SQLite file:
#databases:
#  - name: physiology-db
#    plan: free
