let topic, qs=[], idx=0, score=0, timer, sec=90;
function start(t){
 topic=t; qs=[...BANK[t]]; 
 document.getElementById('setup').style.display='none'; document.getElementById('quiz').style.display='block';
 idx=0; score=0; showQ();
}
function showQ(){
 if(idx>=qs.length){end();return}
 sec=90; clearInterval(timer); tick(); timer=setInterval(tick,1000);
 let q=qs[idx];
 document.getElementById('qno').innerText=`Q ${idx+1}/${qs.length} ${topic}`;
 document.getElementById('qtext').innerText=q.q;
 document.getElementById('sc').innerText=score;
 let h=''; q.stems.forEach((s,i)=>{h+=`<div class="stem" onclick="check(${i})"><div class="badge">${String.fromCharCode(65+i)}</div><div>${s}</div></div>`});
 document.getElementById('stems').innerHTML=h;
 document.getElementById('explain').style.display='none'; document.getElementById('next').style.display='none';
}
function tick(){document.getElementById('timer').innerText=sec+'s'; sec--; if(sec<0) check(-1);}
function check(i){
 clearInterval(timer);
 let q=qs[idx]; let els=document.querySelectorAll('.stem');
 els.forEach((el,ii)=>{if(ii==q.best) el.classList.add('correct','best'); if(ii==i && i!=q.best) el.classList.add('wrong'); el.style.pointerEvents='none';});
 let ex=document.getElementById('explain'); ex.style.display='block';
 if(i==q.best){score+=10; ex.innerHTML=`✅ Correct: ${String.fromCharCode(65+q.best)}<br>${q.exp}`;}
 else if(i==-1){ex.innerHTML=`⏰ Time up! Correct: ${String.fromCharCode(65+q.best)}<br>${q.exp}`;}
 else {ex.innerHTML=`❌ You chose ${String.fromCharCode(65+i)}, Correct is ${String.fromCharCode(65+q.best)}<br>${q.exp}`;}
 document.getElementById('sc').innerText=score; document.getElementById('next').style.display='block';
}
function nextQ(){idx++; showQ();}
function end(){
 document.getElementById('quiz').style.display='none'; document.getElementById('result').style.display='block';
 document.getElementById('rscore').innerText=`Score: ${score}/${qs.length*10} - ${topic}`;
 document.getElementById('rmsg').innerText=score>=qs.length*7?'Excellent! SBA Expert':'Practice more to improve.';try{(adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}
 // save score to backend DB (SQLite on Render, ignored if offline)
 try{fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,score,total:qs.length*10})});}catch(e){}
}
